[package]
name = "litelearn"
version = "0.1.0"
description = "LiteLearn 代码速查知识库"
authors = ["LiteLearn"]
edition = "2021"

[lib]
name = "litelearn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mysql = "28"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
